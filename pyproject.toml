[project]
name = "the-brownfield-cartographer"
version = "0.2.0"
description = "Local-first, deterministic repository structure and data lineage analysis"
authors = [
    { name = "Yonas Mekonnen", email = "myonas886@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Core
    "typer>=0.12",
    "pydantic>=2.0",
    "networkx>=3.3",
    "rich>=13.0",
    "PyYAML>=6.0",
    "pathspec>=0.12,<1",
    # Static analysis
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "sqlglot>=25.0",
    # Graph analysis
    "numpy>=1.26",
    "scipy>=1.14",
]

[project.optional-dependencies]
mcp = ["mcp>=1.26,<2"]
llm = [
    # Legacy, explicitly enabled enrichment; the core never calls a model.
    "langchain-core>=0.3",
    "langchain-openai>=0.3",
    "langchain-google-genai>=2.0",
    "langchain-ollama>=0.3",
    "langgraph>=0.2",
    # Domain clustering
    "scikit-learn>=1.5",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11", "mypy>=1.15"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[project.scripts]
cartographer = "brownfield_cartographer.cli:app"
cartographer-mcp = "brownfield_cartographer.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brownfield_cartographer"]
