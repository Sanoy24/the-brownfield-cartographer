version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
    groups:
      # Major versions arrive as individual pull requests.
      python-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
